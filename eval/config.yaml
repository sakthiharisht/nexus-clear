# Config for `uv run python -m app.eval.run --config eval/config.yaml`
# (run from the repo root; see backend/app/eval/run.py). Paths are relative
# to the repo root regardless of the invocation's working directory.

rule_pack: rules/tx_bcbstx_lpc.yaml
ground_truth: eval/fixtures/ground_truth.json
fixtures_root: eval/fixtures
output_dir: eval/runs

# ceiling: rules engine run directly on ground-truth CaseFacts. Must be
#   100% — a sanity check on the engine and the ground truth, not a real
#   measurement.
# baseline: rules engine run on CaseFacts built by non-LLM extraction
#   (PDF text layer + regex/heuristics) from the rendered packets. This is
#   the number any future LLM-backed stage has to beat.
# end_to_end (M7 #6): the real pipeline - Extract
#   (app/backends/claude_extractor.py) feeding Reconcile
#   (app/reconcile/engine.py, Investigator included) feeding Validate -
#   scored the same way, shown in the same table. One tier
#   (model_classify_fallback), not per-tier - this answers "does the
#   real pipeline work end to end," not a tier comparison.
modes: [ceiling, baseline, end_to_end]

# M5 Classify (SPEC.md section 7.2): each backend/tier run standalone
# (no fallback/escalation - raw per-backend accuracy/calibration), plus
# the DECISION_BACKEND=claude policy end to end (CLAUDE.md invariant 6:
# this one must work with no Jev involvement at all - it uses
# MODEL_CLASSIFY_FALLBACK, i.e. the haiku tier). classify-policy-jev
# needs JEV_API_KEY and isn't run without one. A mode name ending in
# -SIMULATED in the report means its cache entries are still
# app/eval/classify_fixture_seed.py placeholders, not real model
# output - app/eval/live_classify.py replaces them with real recordings
# when run with a live API key (M5.1).
classify_modes:
  [
    classify-jev,
    classify-claude-haiku,
    classify-claude-sonnet,
    classify-claude-opus,
    classify-policy-claude,
  ]

# M5.1 housekeeping #2: ~30 adversarial documents (lookalikes, CVs with
# license-like text, degraded/partial scans, mixed-content pages,
# wrong-slot uploads - app/eval/generator/hard_classify_set.py), a
# different ground_truth/fixtures_root from the 12-packet "easy" set
# above. Reported as separate rows (report.py), never pooled with or
# ranked against the easy set's - n=29 is too small to support a tier
# ranking either way; see the report's own caveat text.
hard_ground_truth: eval/fixtures/hard_classify_ground_truth.json
hard_fixtures_root: eval/fixtures
classify_modes_hard:
  [
    classify-jev-hard,
    classify-claude-haiku-hard,
    classify-claude-sonnet-hard,
    classify-claude-opus-hard,
  ]

# M6 Extract (SPEC.md section 7.3): field-level accuracy/coverage for
# the M3 regex baseline (extract-baseline, no model, no cache) plus
# each Claude tier (app/backends/claude_extractor.py, through the same
# record/replay cache Classify's tiers use). Scope: license/coi/cv only
# - see app/eval/extract_run.py's module docstring for why education/w9
# aren't scored here.
extract_modes:
  [extract-baseline, extract-claude-haiku, extract-claude-sonnet, extract-claude-opus]

# M6.1 #3: the same corpus's two image-only license scans (benign-2's
# genuine rotated scan; defective-7's illegible, wrong-document scan),
# read via vision instead of a text layer that doesn't exist for them
# (app/eval/extract_vision_run.py). n=2 per tier - a capability check
# ("can vision read a scan at all, and does it correctly report
# unknown rather than hallucinate on a bad one"), not a statistically
# meaningful tier comparison.
extract_modes_vision:
  [
    extract-vision-baseline,
    extract-claude-haiku-vision,
    extract-claude-sonnet-vision,
    extract-claude-opus-vision,
  ]

# M6.1 #4: ~30 documents that break the main corpus's "Label: value",
# single-page, unambiguous-date assumptions (noisy layouts, narrative
# prose, multi-page, unusual CV formatting, ambiguous MM/DD dates,
# name suffixes - app/eval/generator/hard_extraction_set.py). Its own
# corpus entirely (not a subset of the 12 packets), so it needs its
# own ground-truth/fixtures_root load like classify's hard set above.
# n=30 across 6 categories - too small to rank tiers against each
# other; see the report's own caveat text.
extract_modes_hard:
  [extract-claude-haiku-hard, extract-claude-sonnet-hard, extract-claude-opus-hard]
hard_extraction_ground_truth: eval/fixtures/hard_extraction_ground_truth.json
hard_extraction_fixtures_root: eval/fixtures
