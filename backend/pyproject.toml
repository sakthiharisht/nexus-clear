[project]
name = "nexus-clear-backend"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "pydantic-settings>=2.16.2",
    "pydantic>=2",
    "uvicorn[standard]>=0.54.0",
    "sqlalchemy>=2",
    "alembic>=1.20.1",
    "psycopg[binary]>=3.3.7",
    "pyyaml>=6.0.3",
    "cryptography>=50.0.2",
    "python-multipart>=0.0.20",
    "anthropic>=2.4.0",
    "httpx>=0.28.1",
    "mcp[cli]>=2.3.0",
    # Used by production code, not just eval/test tooling: pypdf reads
    # PDF text in the live orchestrator (app/orchestrator/run.py),
    # rapidfuzz does name matching in the live Reconcile stage
    # (app/reconcile/matching.py). Misclassifying these as dev-only
    # broke `docker compose up --build`'s `uv sync --frozen --no-dev`.
    "pypdf>=6.21.4",
    "rapidfuzz>=3.14.6",
]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest-cov>=7.1.0",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
    "types-pyyaml>=6.0.12.20261030",
    "reportlab>=5.1.0",
    "pillow>=13.0.0",
    "faker>=40.44.0",
    "types-reportlab>=5.0.0.20261008",
    "python-dotenv>=1.2.4",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# Alembic revision scripts are generated (and re-generated) by `alembic
# revision --autogenerate`; they're not hand-maintained to the same style.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency injection requires `Depends(...)` (and friends) as
# a parameter default; it's a factory call, not the mutable-default
# footgun B008 exists to catch.
extend-immutable-calls = ["fastapi.Depends", "fastapi.params.Depends"]

[tool.mypy]
python_version = "3.12"
packages = ["app"]
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    # starlette's TestClient warns that it'll require `httpx2` in a future
    # release; nothing to act on until that lands, so silence it for now.
    "ignore::starlette.exceptions.StarletteDeprecationWarning",
]
